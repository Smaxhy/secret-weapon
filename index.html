<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hon'yaku — JP⇄EN</title>
<meta name="theme-color" content="#0f0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f0f14;--card:#1a1a22;--card2:#23232e;--tx:#f3f3f6;--mut:#9a9aab;--acc:#ff4d6d;--acc2:#ffb3c1;--ok:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:rgba(15,15,20,.92);backdrop-filter:blur(8px);padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #26263a}
header h1{font-size:18px;margin:0;flex:1}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mut)}
.pill.on{background:#123b2a;color:var(--ok)}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px}
.dir{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600}
button{font:inherit;color:inherit;background:var(--card2);border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
.primary{background:var(--acc);color:#fff;font-weight:700}
textarea{width:100%;min-height:90px;background:var(--card2);color:var(--tx);border:0;border-radius:12px;padding:12px;font:inherit;font-size:18px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.out{margin-top:12px;background:var(--card2);border-radius:12px;padding:12px;min-height:60px}
.jp{font-size:24px;font-weight:600}
.ro{color:var(--acc2);font-size:14px}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
.toggle{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.toggle button{background:none;padding:6px 12px;font-size:14px}
.toggle button.on{background:var(--acc);color:#fff}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;padding:12px 4px;font-size:12px;gap:4px}
.cat span{font-size:26px}
.cat.on{outline:2px solid var(--acc)}
.ph{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #2a2a38}
.ph:last-child{border:0}
.ph .t{flex:1;cursor:pointer}
.ph .en{font-size:14px;color:var(--mut)}
.ph .j{font-size:19px}
.ic{background:none;padding:6px;font-size:18px}
input[type=search]{width:100%;background:var(--card2);border:0;border-radius:12px;padding:12px;color:var(--tx);font:inherit;margin-bottom:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#14141c;border-top:1px solid #26263a;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:12px 0;font-size:13px;color:var(--mut)}
nav button.on{color:var(--acc)}
.hide{display:none!important}
#show{position:fixed;inset:0;background:#fff;color:#111;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#show .big{font-size:clamp(34px,9vw,72px);font-weight:700;line-height:1.3}
#show .small{font-size:18px;color:#666;margin-top:16px}
.note{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>🇯🇵 Hon'yaku <span style="color:var(--mut);font-weight:400">JP⇄EN</span></h1>
  <span id="net" class="pill">offline</span>
</header>

<main>
<!-- TRANSLATE -->
<section id="tab-tr">
  <div class="card">
    <div class="dir">
      <span id="fromL">English</span>
      <button id="swap" aria-label="swap">⇄</button>
      <span id="toL">日本語</span>
    </div>
    <textarea id="inp" placeholder="Type or paste anything… (auto-detects language)"></textarea>
    <div class="row">
      <button class="primary" id="go">Translate</button>
      <button id="mic" title="Speak">🎤</button>
      <div class="toggle" id="tone"><button data-t="casual" class="on">Casual</button><button data-t="polite">Polite</button></div>
      <button id="clr">✕</button>
    </div>
    <div id="out" class="out"><span class="note">Translation shows here. Phrasebook works offline; full sentences use the internet when available.</span></div>
    <div class="row" id="outBtns" style="display:none">
      <button id="say">🔊 Speak</button><button id="copy">📋 Copy</button><button id="showBtn">🖥 Show</button><button id="fav">⭐ Save</button>
    </div>
  </div>
  <div class="card"><b>Quick picks</b><div class="cats" id="quickCats" style="margin-top:10px"></div></div>
</section>

<!-- PHRASES -->
<section id="tab-ph" class="hide">
  <input type="search" id="q" placeholder="Search all phrases (EN, 日本語, romaji)…">
  <div class="cats" id="cats"></div>
  <div class="row"><div class="toggle" id="tone2"><button data-t="casual" class="on">Casual</button><button data-t="polite">Polite</button></div></div>
  <div class="card" id="list" style="margin-top:12px"></div>
</section>

<!-- SAVED -->
<section id="tab-sv" class="hide">
  <div class="card"><b>⭐ Saved</b><div id="saved"></div></div>
  <div class="card"><b>🕘 History</b> <button class="ic" id="clrH">🗑</button><div id="hist"></div></div>
</section>
</main>

<nav>
  <button data-tab="tr" class="on">🔤<br>Translate</button>
  <button data-tab="ph">📚<br>Phrases</button>
  <button data-tab="sv">⭐<br>Saved</button>
</nav>

<div id="show" class="hide"><div class="big" id="showBig"></div><div class="small" id="showSmall"></div><button style="margin-top:30px;background:#eee" id="showX">Close</button></div>

<script src="phrases.js"></script>
<script src="app.js"></script>
</body>
</html>
