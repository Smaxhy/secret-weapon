<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hHair" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ff7eb6"/>
      <stop offset="0.45" stop-color="#d9468f"/>
      <stop offset="1" stop-color="#6a2a92"/>
    </linearGradient>
    <linearGradient id="hHairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c23c84"/>
      <stop offset="1" stop-color="#4a1f78"/>
    </linearGradient>
    <linearGradient id="hIris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a0f3d"/>
      <stop offset="0.55" stop-color="#c2307f"/>
      <stop offset="1" stop-color="#ffb04d"/>
    </linearGradient>
    <linearGradient id="hSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeee6"/>
      <stop offset="1" stop-color="#ffd9cb"/>
    </linearGradient>
    <linearGradient id="hTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1236"/>
      <stop offset="1" stop-color="#14081d"/>
    </linearGradient>
    <radialGradient id="hCheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6f9d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6f9d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hLip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5c8f"/>
      <stop offset="1" stop-color="#c71f5a"/>
    </linearGradient>
    <clipPath id="hEyeL"><path d="M70 98 C76 90 90 89 96 95 C93 103 78 106 70 98 Z"/></clipPath>
    <clipPath id="hEyeR"><path d="M130 98 C124 90 110 89 104 95 C107 103 122 106 130 98 Z"/></clipPath>
  </defs>

  <!-- back hair: long and wavy -->
  <path d="M40 96 C36 50 66 24 100 24 C138 24 166 52 160 100 C158 124 168 140 164 160 C170 172 168 188 172 200 L28 200 C32 188 30 172 36 160 C32 140 42 124 40 96 Z" fill="url(#hHairBack)"/>

  <!-- shoulders + neck -->
  <path d="M22 200 C26 178 46 166 72 162 C80 160 86 156 88 148 L112 148 C114 156 120 160 128 162 C154 166 174 178 178 200 Z" fill="url(#hSkin)"/>
  <path d="M88 130 L88 152 C94 158 106 158 112 152 L112 130 Z" fill="#f6c8b8"/>
  <!-- collarbones -->
  <path d="M74 170 C82 167 90 167 96 170 M104 170 C110 167 118 167 126 170" stroke="#e9ad9b" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- off-shoulder top -->
  <path d="M24 200 C28 190 34 184 44 182 C58 186 74 186 84 190 C90 192 96 196 100 199 C104 196 110 192 116 190 C126 186 142 186 156 182 C166 184 172 190 176 200 Z" fill="url(#hTop)"/>
  <path d="M44 182 C58 186 74 186 84 190 C90 192 96 196 100 199 C104 196 110 192 116 190 C126 186 142 186 156 182" stroke="#ff5c9e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M100 186 C99.5 190 99.5 194 100 198" stroke="#e3a191" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M86 180 C90 184 94 186 98 186 M114 180 C110 184 106 186 102 186" stroke="#efb9a8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- choker with heart -->
  <path d="M88 142 C94 146 106 146 112 142 L112 147 C106 151 94 151 88 147 Z" fill="#1a0a22"/>
  <path d="M100 150 C97 146 93 149 96 152 L100 156 L104 152 C107 149 103 146 100 150 Z" fill="#ff4f93"/>

  <!-- face -->
  <path d="M66 84 C66 118 80 140 100 146 C120 140 134 118 134 84 C134 60 120 48 100 48 C80 48 66 60 66 84 Z" fill="url(#hSkin)"/>
  <ellipse cx="66" cy="98" rx="4.5" ry="8" fill="#ffd3c3"/>
  <ellipse cx="134" cy="98" rx="4.5" ry="8" fill="#ffd3c3"/>
  <!-- hoop earrings -->
  <circle cx="65" cy="112" r="5.5" fill="none" stroke="#ffcf4d" stroke-width="2"/>
  <circle cx="135" cy="112" r="5.5" fill="none" stroke="#ffcf4d" stroke-width="2"/>

  <!-- blush -->
  <g class="blush-soft"><ellipse cx="78" cy="114" rx="10" ry="5" fill="url(#hCheek)"/><ellipse cx="122" cy="114" rx="10" ry="5" fill="url(#hCheek)"/></g>
  <g class="blush-strong" display="none">
    <ellipse cx="78" cy="113" rx="13" ry="7" fill="#ff5c8f" opacity="0.45"/><ellipse cx="122" cy="113" rx="13" ry="7" fill="#ff5c8f" opacity="0.45"/>
    <g stroke="#e8336f" stroke-width="1.3" stroke-linecap="round"><path d="M72 111 L70 115 M77 111 L75 115 M82 111 L80 115 M118 111 L116 115 M123 111 L121 115 M128 111 L126 115"/></g>
  </g>

  <!-- eyeshadow -->
  <path d="M68 94 C74 84 92 83 98 92 C92 88 76 88 68 96 Z" fill="#ff7aa8" opacity="0.35"/>

  <g class="hana-eyes">
    <!-- left eye (sultry, half-lidded) -->
    <g>
      <path d="M70 98 C76 90 90 89 96 95 C93 103 78 106 70 98 Z" fill="#fff"/>
      <g clip-path="url(#hEyeL)">
        <ellipse cx="84" cy="99" rx="8" ry="10" fill="url(#hIris)"/>
        <ellipse cx="84" cy="100" rx="3.6" ry="5" fill="#2a0420"/>
        <path d="M68 88 L98 88 L98 95 C90 92 76 92 68 98 Z" fill="#b48aa8" opacity="0.45"/>
      </g>
      <path d="M81.5 95.5 C80.6 94.4 79 95.2 79.8 96.6 L81.5 98.2 L83.2 96.6 C84 95.2 82.4 94.4 81.5 95.5 Z" fill="#fff"/>
      <circle cx="87" cy="102" r="1.2" fill="#fff" opacity="0.85"/>
      <path d="M66 97 C72 88 90 85 99 94 L97 96 C89 90 74 91 68 99 Z" fill="#1c0817"/>
      <path d="M67 97 L60 94 M68 99 L62 99" stroke="#1c0817" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M74 103 C80 105.5 88 105.5 93 102" stroke="#a65a7c" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
    <!-- right eye -->
    <g class="eyeR-open">
      <path d="M132 94 C126 84 108 83 102 92 C108 88 124 88 132 96 Z" fill="#ff7aa8" opacity="0.35"/>
      <path d="M130 98 C124 90 110 89 104 95 C107 103 122 106 130 98 Z" fill="#fff"/>
      <g clip-path="url(#hEyeR)">
        <ellipse cx="116" cy="99" rx="8" ry="10" fill="url(#hIris)"/>
        <ellipse cx="116" cy="100" rx="3.6" ry="5" fill="#2a0420"/>
        <path d="M132 88 L102 88 L102 95 C110 92 124 92 132 98 Z" fill="#b48aa8" opacity="0.45"/>
      </g>
      <path d="M113.5 95.5 C112.6 94.4 111 95.2 111.8 96.6 L113.5 98.2 L115.2 96.6 C116 95.2 114.4 94.4 113.5 95.5 Z" fill="#fff"/>
      <circle cx="119" cy="102" r="1.2" fill="#fff" opacity="0.85"/>
      <path d="M134 97 C128 88 110 85 101 94 L103 96 C111 90 126 91 132 99 Z" fill="#1c0817"/>
      <path d="M133 97 L140 94 M132 99 L138 99" stroke="#1c0817" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M126 103 C120 105.5 112 105.5 107 102" stroke="#a65a7c" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <!-- wink (hidden unless .wink) -->
  <g class="eyeR-wink" display="none">
    <path d="M103 98 C110 103 122 103 131 96" stroke="#1c0817" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M131 96 L138 93 M130 99 L136 100" stroke="#1c0817" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- beauty mark -->
  <circle cx="126" cy="110" r="1.4" fill="#4a1d34"/>
  <!-- brows (one raised = smug) -->
  <path d="M73 82 C79 79 87 79 93 81" stroke="#8a2f68" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M107 79 C113 76 121 76 128 80" stroke="#8a2f68" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M101 112 L99.5 117 L102 117.5" stroke="#e09a88" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- mouth: smirk -->
  <g class="mouth-smirk">
    <path d="M92 127 C96 130.5 103 131 109 125 C104 129.5 97 129.5 92 127 Z" fill="url(#hLip)"/>
    <path d="M92 127 C97 126 103 126.5 109 125" stroke="#b81a52" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M98 129 C100 129.6 102 129.4 103.5 128.6" stroke="#ffc0d4" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
  <!-- mouth: flustered (hidden unless .fluster) -->
  <g class="mouth-fluster" display="none">
    <path d="M92 128 Q95 125 98 128 Q101 131 104 128 Q107 125 110 128" stroke="#b81a52" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- sweat drop -->
  <path class="sweat" display="none" d="M140 70 C136 76 136 80 140 81 C144 80 144 76 140 70 Z" fill="#9fe3ff" stroke="#4cb8e6" stroke-width="1"/>

  <!-- bangs: side-swept -->
  <path d="M60 96 C52 54 78 30 104 30 C132 30 152 50 144 92 C140 76 132 64 120 58 C124 70 120 78 112 84 C112 70 104 60 94 56 C90 68 80 76 66 82 C70 72 70 66 68 62 C64 72 62 84 60 96 Z" fill="url(#hHair)"/>
  <path d="M94 56 C96 66 92 76 84 84 C96 76 104 66 104 58 Z" fill="#c23c84" opacity="0.5"/>
  <!-- long side locks -->
  <path d="M64 80 C54 112 58 140 48 172 C66 160 72 130 70 104 C70 94 68 86 64 80 Z" fill="url(#hHair)"/>
  <path d="M136 80 C148 108 144 136 156 168 C138 158 130 130 130 104 C130 94 132 86 136 80 Z" fill="url(#hHair)"/>
  <!-- hair shine -->
  <path d="M76 44 C88 36 114 35 128 44" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.45"/>
  <g stroke="#a92f76" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M112 60 C116 68 116 76 112 84"/><path d="M128 64 C134 72 136 80 134 88"/><path d="M80 66 C76 72 72 78 66 82"/>
  </g>
  <!-- sakura clip -->
  <g transform="translate(140 58)">
    <g fill="#fff" stroke="#ff5c9e" stroke-width="1.2">
      <ellipse cx="0" cy="-7" rx="4.5" ry="6"/>
      <ellipse cx="6.7" cy="-2.2" rx="4.5" ry="6" transform="rotate(72 6.7 -2.2)"/>
      <ellipse cx="4.1" cy="5.7" rx="4.5" ry="6" transform="rotate(144 4.1 5.7)"/>
      <ellipse cx="-4.1" cy="5.7" rx="4.5" ry="6" transform="rotate(216 -4.1 5.7)"/>
      <ellipse cx="-6.7" cy="-2.2" rx="4.5" ry="6" transform="rotate(288 -6.7 -2.2)"/>
    </g>
    <circle r="3" fill="#ffcf4d"/>
  </g>
</svg>
