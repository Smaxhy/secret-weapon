<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc2e2"/>
      <stop offset="0.55" stop-color="#f59ad0"/>
      <stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e57bbf"/>
      <stop offset="1" stop-color="#8f63e8"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1a6b"/>
      <stop offset="0.5" stop-color="#8b4dff"/>
      <stop offset="1" stop-color="#ff7ac6"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1ea"/>
      <stop offset="1" stop-color="#ffe0d4"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2350"/>
      <stop offset="1" stop-color="#17112e"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fb3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8fb3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- back hair -->
  <path class="hana-back" d="M44 92 C40 46 72 22 100 22 C130 22 160 44 156 94 C158 128 166 150 172 178 L132 186 C128 160 126 140 124 128 L76 128 C74 140 72 160 68 186 L28 178 C34 150 42 128 44 92 Z" fill="url(#hairBack)"/>

  <!-- hoodie / shoulders -->
  <path d="M30 200 C34 172 56 158 82 152 L118 152 C144 158 166 172 170 200 Z" fill="url(#hood)"/>
  <path d="M82 152 C88 166 112 166 118 152 L112 150 C106 158 94 158 88 150 Z" fill="#3a3070"/>
  <path d="M92 162 L90 186" stroke="#ff8cc8" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 162 L110 186" stroke="#ff8cc8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="90" cy="188" r="3" fill="#ffd0ea"/>
  <circle cx="110" cy="188" r="3" fill="#ffd0ea"/>
  <!-- headphones around neck -->
  <path d="M66 156 C70 170 130 170 134 156" fill="none" stroke="#1d1838" stroke-width="7" stroke-linecap="round"/>
  <rect x="56" y="146" width="16" height="22" rx="7" fill="#ff7ac6"/>
  <rect x="128" y="146" width="16" height="22" rx="7" fill="#ff7ac6"/>
  <rect x="59" y="150" width="10" height="14" rx="4" fill="#ffc2e2"/>
  <rect x="131" y="150" width="10" height="14" rx="4" fill="#ffc2e2"/>

  <!-- neck -->
  <path d="M88 132 L88 152 C94 156 106 156 112 152 L112 132 Z" fill="#f7cfc2"/>

  <!-- face -->
  <path d="M60 84 C60 120 76 144 100 148 C124 144 140 120 140 84 C140 62 124 50 100 50 C76 50 60 62 60 84 Z" fill="url(#skin)"/>
  <!-- ears -->
  <ellipse cx="60" cy="96" rx="5" ry="9" fill="#ffd9cc"/>
  <ellipse cx="140" cy="96" rx="5" ry="9" fill="#ffd9cc"/>

  <!-- blush -->
  <ellipse cx="74" cy="114" rx="11" ry="6" fill="url(#cheek)"/>
  <ellipse cx="126" cy="114" rx="11" ry="6" fill="url(#cheek)"/>
  <g stroke="#ff7aa8" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <path d="M69 113 L67 116"/><path d="M74 113 L72 116"/><path d="M79 113 L77 116"/>
    <path d="M121 113 L119 116"/><path d="M126 113 L124 116"/><path d="M131 113 L129 116"/>
  </g>

  <!-- eyes -->
  <clipPath id="eyeL"><path d="M67 92 C72 84 92 81 97 88 L97 102 C93 112 74 113 68 104 Z"/></clipPath>
  <clipPath id="eyeR"><path d="M133 92 C128 84 108 81 103 88 L103 102 C107 112 126 113 132 104 Z"/></clipPath>
  <g class="hana-eyes">
    <g>
      <path d="M67 92 C72 84 92 81 97 88 L97 102 C93 112 74 113 68 104 Z" fill="#ffffff"/>
      <g clip-path="url(#eyeL)">
        <ellipse cx="83" cy="98" rx="10" ry="13" fill="url(#iris)"/>
        <ellipse cx="83" cy="100" rx="4.6" ry="6.5" fill="#1b0b36"/>
        <path d="M70 86 L98 86 L98 92 C90 90 76 90 70 94 Z" fill="#c9b6e8" opacity="0.5"/>
      </g>
      <ellipse cx="79" cy="92" rx="3.6" ry="4.6" fill="#ffffff"/>
      <circle cx="87.5" cy="104.5" r="2" fill="#ffffff" opacity="0.9"/>
      <path d="M63 93 C68 82 90 76 99 86 L98 89 C89 82 72 84 66 95 Z" fill="#2a1446"/>
      <path d="M65 92 L59 88 M66 95 L61 95" stroke="#2a1446" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M72 109 C78 112 88 112 94 108" stroke="#b86a94" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <path d="M133 92 C128 84 108 81 103 88 L103 102 C107 112 126 113 132 104 Z" fill="#ffffff"/>
      <g clip-path="url(#eyeR)">
        <ellipse cx="117" cy="98" rx="10" ry="13" fill="url(#iris)"/>
        <ellipse cx="117" cy="100" rx="4.6" ry="6.5" fill="#1b0b36"/>
        <path d="M130 86 L102 86 L102 92 C110 90 124 90 130 94 Z" fill="#c9b6e8" opacity="0.5"/>
      </g>
      <ellipse cx="113" cy="92" rx="3.6" ry="4.6" fill="#ffffff"/>
      <circle cx="121.5" cy="104.5" r="2" fill="#ffffff" opacity="0.9"/>
      <path d="M137 93 C132 82 110 76 101 86 L102 89 C111 82 128 84 134 95 Z" fill="#2a1446"/>
      <path d="M135 92 L141 88 M134 95 L139 95" stroke="#2a1446" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M106 108 C112 112 122 112 128 109" stroke="#b86a94" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <!-- brows -->
  <path d="M72 74 C78 71 86 71 92 73" stroke="#b05a9a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M108 73 C114 71 122 71 128 74" stroke="#b05a9a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- nose + mouth -->
  <path d="M100 116 L99 119" stroke="#e5a08f" stroke-width="1.5" stroke-linecap="round"/>
  <path class="hana-mouth" d="M93 126 C96 132 104 132 107 126 C104 128 96 128 93 126 Z" fill="#e85b8a"/>
  <path d="M96 129 C98 131 102 131 104 129" stroke="#ff9cb9" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- bangs -->
  <path d="M56 92 C50 52 76 30 102 30 C130 30 152 52 144 94 C140 80 136 70 130 64 C132 74 130 82 126 88 C124 76 118 66 110 60 C112 70 108 78 102 84 C102 74 98 64 92 58 C90 70 84 78 76 84 C78 74 76 66 72 62 C66 70 62 80 56 92 Z" fill="url(#hair)"/>
  <g stroke="#e07ab8" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M92 58 C90 66 86 74 80 80"/><path d="M110 60 C112 68 110 76 104 82"/><path d="M72 62 C70 70 66 78 60 86"/><path d="M130 64 C134 72 134 80 130 86"/>
  </g>
  <!-- side locks -->
  <path d="M58 82 C52 110 54 136 48 160 C60 150 66 126 66 104 C66 96 64 88 58 82 Z" fill="url(#hair)"/>
  <path d="M142 82 C148 110 146 136 152 160 C140 150 134 126 134 104 C134 96 136 88 142 82 Z" fill="url(#hair)"/>
  <!-- hair shine -->
  <path d="M74 44 C88 36 112 36 126 44" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M84 48 C94 44 106 44 116 48" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- ahoge -->
  <path class="hana-ahoge" d="M100 31 C98 18 106 10 116 12 C108 14 104 20 104 31 Z" fill="url(#hair)"/>

  <!-- sakura hair clip -->
  <g transform="translate(136 56)">
    <g fill="#ffffff" stroke="#ff7ac6" stroke-width="1.2">
      <ellipse cx="0" cy="-7" rx="4.5" ry="6"/>
      <ellipse cx="6.7" cy="-2.2" rx="4.5" ry="6" transform="rotate(72 6.7 -2.2)"/>
      <ellipse cx="4.1" cy="5.7" rx="4.5" ry="6" transform="rotate(144 4.1 5.7)"/>
      <ellipse cx="-4.1" cy="5.7" rx="4.5" ry="6" transform="rotate(216 -4.1 5.7)"/>
      <ellipse cx="-6.7" cy="-2.2" rx="4.5" ry="6" transform="rotate(288 -6.7 -2.2)"/>
    </g>
    <circle r="3" fill="#ffcf4d"/>
  </g>
</svg>
